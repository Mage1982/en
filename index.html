<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Modell Nézegető Demó</title>
  
  <!-- Google <model-viewer> modul betöltése -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 30, 46, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0b0f19 75%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: var(--text-sub);
    }

    .controls-container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      padding: 16px 20px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    label {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-sub);
      white-space: nowrap;
    }

    select {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: rgba(15, 23, 42, 0.9);
      color: var(--text-main);
      font-size: 1rem;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }

    select:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    optgroup {
      font-weight: bold;
      color: var(--accent-color);
      background: #0f172a;
    }

    option {
      color: var(--text-main);
      background: #0f172a;
      padding: 10px;
    }

    .viewer-card {
      width: 100%;
      max-width: 900px;
      height: 65vh;
      min-height: 450px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    .status-bar {
      margin-top: 15px;
      font-size: 0.9rem;
      color: var(--text-sub);
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .status-bar span {
      color: var(--accent-color);
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .controls-container {
        flex-direction: column;
        align-items: flex-start;
      }
      .viewer-card {
        height: 50vh;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>3D Modell Nézegető Demó</h1>
    <p class="subtitle">Interaktív 3D modellek megjelenítése valós időben</p>
  </header>

  <main class="controls-container">
    <label for="model-select">Válassz modellt:</label>
    <select id="model-select" onchange="changeModel(this.value)">
      <optgroup label="Saját & CDN Modellek">
        <option value="https://raw.githubusercontent.com/google/model-viewer/master/packages/shared-assets/models/glTF-Sample-Assets/Models/Castle/glTF-Binary/Castle.glb" selected>Kastély GLB</option>
        <option value="https://raw.githubusercontent.com/google/model-viewer/master/packages/shared-assets/models/glTF-Sample-Assets/Models/SheenChair/glTF-Binary/SheenChair.glb">Szék GLB</option>
      </optgroup>
      <optgroup label="Űrhajósok & Figurák">
        <option value="https://modelviewer.dev/shared-assets/models/Astronaut.glb">Asztronauta</option>
        <option value="https://modelviewer.dev/shared-assets/models/NeilArmstrong.glb">Neil Armstrong</option>
        <option value="https://modelviewer.dev/shared-assets/models/RobotExpressive.glb">Robot Animált</option>
      </optgroup>
    </select>
  </main>

  <section class="viewer-card">
    <model-viewer 
      id="3d-viewer" 
      src="https://raw.githubusercontent.com/google/model-viewer/master/packages/shared-assets/models/glTF-Sample-Assets/Models/Castle/glTF-Binary/Castle.glb" 
      alt="3D Modell" 
      camera-controls 
      auto-rotate 
      shadow-intensity="1" 
      ar>
    </model-viewer>
  </section>

  <div class="status-bar">
    Jelenleg betöltve: <span id="selected-model-name">Kastély GLB</span>
  </div>

  <script>
    function changeModel(src) {
      const viewer = document.getElementById('3d-viewer');
      const selectElement = document.getElementById('model-select');
      const statusElement = document.getElementById('selected-model-name');
      
      // Modell forrásának és állapotának frissítése
      viewer.setAttribute('src', src);
      
      const selectedText = selectElement.options[selectElement.selectedIndex].text;
      statusElement.textContent = selectedText;
    }
  </script>

</body>
</html>
