<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Modell Nézegető Demó</title>

  <!-- Google <model-viewer> modul betöltése -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #38bdf8;
    }

    .controls-container {
      width: 100%;
      max-width: 800px;
      background: #1e293b;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    label {
      font-size: 0.95rem;
      font-weight: 600;
      color: #94a3b8;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 1rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: #38bdf8;
    }

    optgroup {
      font-weight: bold;
      color: #38bdf8;
      background: #1e293b;
    }

    option {
      color: #ffffff;
      background: #0f172a;
      padding: 8px;
    }

    .viewer-card {
      width: 100%;
      max-width: 800px;
      height: 60vh;
      min-height: 400px;
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    .status-bar {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #64748b;
      text-align: center;
    }

    .status-bar span {
      color: #38bdf8;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <h1>3D Modell Nézegető Demó</h1>
  </header>

  <main class="controls-container">
    <label for="model-select">Válassz ki egy 3D modellt:</label>
    <select id="model-select" onchange="changeModel(this.value)">
      <optgroup label="Saját GitHub Modellek">
        <option value="models/kereszt.obj" selected>Kereszt OBJ</option>
        <option value="models/virag.obj">Virág OBJ</option>
      </optgroup>
      <optgroup label="Űrhajósok & Figurák">
        <option value="https://modelviewer.dev/shared-assets/models/Astronaut.glb">Asztronauta</option>

        <option value="https://modelviewer.dev/shared-assets/models/RobotExpressive.glb">Robot Animált</option>
      </optgroup>
    </select>
  </main>

  <section class="viewer-card">
    <model-viewer 
      id="3d-viewer" 
      src="models/kereszt.obj" 
      alt="3D Modell" 
      camera-controls 
      auto-rotate 
      shadow-intensity="1" 
      ar>
    </model-viewer>
  </section>

  <div class="status-bar">
    Kiválasztva: <span id="selected-model-name">Kereszt OBJ</span>
  </div>

  <script>
    function changeModel(src) {
      const viewer = document.getElementById('3d-viewer');
      const selectElement = document.getElementById('model-select');
      const statusElement = document.getElementById('selected-model-name');
      
      // Modell forrásának frissítése
      viewer.setAttribute('src', src);
      
      // Kiválasztott opció nevének frissítése a statuszsorban
      const selectedText = selectElement.options[selectElement.selectedIndex].text;
      statusElement.textContent = selectedText;
    }
  </script>

</body>
</html>
