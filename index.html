<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Termék Landing Page (model-viewer)</title>
  <!-- Google <model-viewer> webkomponens betöltése -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .landing-container {
      width: 100%;
      max-width: 1200px;
      height: 1000px;
      background: #1e293b;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 24px;
      text-align: center;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }

    header h1 {
      font-size: 1.8rem;
      color: #38bdf8;
    }

    .main-content {
      display: flex;
      flex: 1;
      height: calc(1000px - 90px);
    }

    /* 3D Viewer terület */
    .viewer-section {
      flex: 2;
      position: relative;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    /* Termékválasztó oldalsáv */
    .products-sidebar {
      flex: 1;
      padding: 24px;
      background: #0f172a;
      border-left: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .product-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .product-card:hover {
      border-color: #0284c7;
      transform: translateY(-2px);
    }

    .product-card.active {
      border-color: #38bdf8;
      background: #0284c722;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }

    .product-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #f8fafc;
    }

    .product-card.active .product-title {
      color: #38bdf8;
    }

    .product-desc {
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.4;
    }

    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 8px;
      background: #334155;
      color: #38bdf8;
      font-size: 0.75rem;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="landing-container">
    <header>
      <h1>3D Termékbemutató Landing Page</h1>
    </header>

    <div class="main-content">
      <!-- 3D Renderelési Hely (Google model-viewer) -->
      <div class="viewer-section">
        <model-viewer 
          id="main-viewer"
          src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
          alt="3D Astronaut modell" 
          auto-rotate 
          camera-controls 
          shadow-intensity="1.5"
          exposure="1"
          ar>
        </model-viewer>
      </div>

      <!-- Termékválasztó -->
      <div class="products-sidebar">
        
        <div class="product-card active" onclick="selectProduct(0)">
          <div class="product-title">Termék 1</div>
          <div class="product-desc">Részletes űrhajós (Astronaut) 3D modell élethű anyagszerkezettel.</div>
          <span class="badge">GLB Formátum</span>
        </div>

        <div class="product-card" onclick="selectProduct(1)">
          <div class="product-title">Termék 2</div>
          <div class="product-desc">Retro stílusú Neil Armstrong űrhajós figura (NeilArmstrong.glb).</div>
          <span class="badge">GLB Formátum</span>
        </div>

        <div class="product-card" onclick="selectProduct(2)">
          <div class="product-title">Termék 3</div>
          <div class="product-desc">Modern dizájn szék (Chair) 3D modell szövet és fa textúrával.</div>
          <span class="badge">GLB Formátum</span>
        </div>

      </div>
    </div>
  </div>

  <script>
    // 3D Termékek adatai (Hivatalos Google model-viewer CDN GLB fájlok)
    const products = [
      {
        id: 0,
        name: "Termék 1",
        src: "https://modelviewer.dev/shared-assets/models/Astronaut.glb",
        alt: "3D Astronaut modell"
      },
      {
        id: 1,
        name: "Termék 2",
        src: "https://modelviewer.dev/shared-assets/models/NeilArmstrong.glb",
        alt: "3D Neil Armstrong modell"
      },
      {
        id: 2,
        name: "Termék 3",
        src: "https://modelviewer.dev/shared-assets/models/glTF-Sample-Assets/Models/SheenChair/glTF-Binary/SheenChair.glb",
        alt: "3D Szék modell"
      }
    ];

    const viewer = document.getElementById('main-viewer');

    function selectProduct(index) {
      const cards = document.querySelectorAll('.product-card');
      cards.forEach((card, i) => {
        if (i === index) {
          card.classList.add('active');
        } else {
          card.classList.remove('active');
        }
      });

      // Modell forrásának és leírásának frissítése
      viewer.src = products[index].src;
      viewer.alt = products[index].alt;
    }
  </script>
</body>
</html>
