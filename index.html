<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>3D Model Viewer Teszt</title>
  <!-- model-viewer script betöltése -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

  <!-- Ingyenes minta glTF/GLB modell közvetlen Google CDN-ről -->
  <model-viewer 
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
    alt="3D űrhajós modell" 
    auto-rotate 
    camera-controls 
    style="width: 100%; height: 1000px; background-color: #f0f0f0;">
  </model-viewer>

  const loader = new OBJLoader();
loader.load('path/to/model.obj', (object) => {
    scene.add(object);
});
</body>
</html>
